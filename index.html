<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Welfare Petition</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- App Header with Logo -->
  <header>
    <img src="nagrikmanch.png" alt="App Logo" class="app-logo">
    <h1>Public Welfare Petition Portal</h1>
  </header>

  <!-- Welcome Page -->
  <div class="container" id="welcomePage">
    <h2>Welcome Citizen</h2>
    <p>Please provide your details to continue</p>
    <form id="welcomeForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <select id="gender" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
      <input type="text" id="locality" placeholder="Locality" required>
      <input type="text" id="aadhaar" placeholder="Aadhaar Number" maxlength="12" required>
      <button type="submit">Continue</button>
    </form>
  </div>

  <!-- Home Page -->
  <div class="container hidden" id="homePage">
    <p id="welcomeUser"></p>
    ...
  </div>

  <script src="script.js"></script>
</body>
</html>
